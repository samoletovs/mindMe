name: "Auto-merge additive knowledge PRs"

# mindMe / mindVault are single-purpose knowledge repos populated by the memex
# pipeline. Those PRs only ADD markdown under wiki/ (or knowledge/wiki/) and never
# delete. This workflow merges exactly that shape automatically and leaves anything
# else for a human (and the org-wide daily janitor) to review. It is the durable,
# always-on counterpart to the app-side daily PR sweep.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-knowledge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Knowledge auto-merge
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate and merge purely-additive markdown
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const SELF_CHECK_NAME = 'Knowledge auto-merge';

            // Only purely-additive markdown knowledge files qualify.
            const KNOWLEDGE = /^(knowledge\/)?(wiki|reports)\/.+\.md$/i;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: number, per_page: 100
            });
            const qualifies =
              files.length > 0 &&
              files.every(f => KNOWLEDGE.test(f.filename) && f.deletions === 0 && f.status !== 'removed');
            if (!qualifies) {
              console.log('Not a purely-additive knowledge PR - leaving for review.');
              return;
            }

            // Poll mergeability (computed asynchronously; null right after `opened`).
            let pr;
            for (let i = 0; i < 8; i++) {
              ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number }));
              if (pr.merged || pr.state !== 'open') return;
              if (pr.mergeable !== null) break;
              await new Promise(r => setTimeout(r, 5000));
            }
            if (pr.mergeable === false) { console.log('Conflicts - skipping.'); return; }

            // Respect any other checks that may exist; exclude our own run.
            const { data: checks } = await github.rest.checks.listForRef({
              owner, repo, ref: pr.head.sha, per_page: 100
            });
            const others = checks.check_runs.filter(c => c.name !== SELF_CHECK_NAME);
            const OK = new Set(['success', 'neutral', 'skipped']);
            if (others.some(c => c.status === 'completed' && !OK.has(c.conclusion))) {
              console.log('A check failed - skipping.'); return;
            }
            if (others.some(c => c.status !== 'completed')) {
              console.log('Checks still pending - will retry.'); return;
            }

            await github.rest.pulls.merge({
              owner, repo, pull_number: number, merge_method: 'squash'
            });
            console.log(`Squash-merged additive knowledge PR #${number}.`);
