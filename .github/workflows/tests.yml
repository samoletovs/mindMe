name: "Tests"

# Unit tests for the Function App harness. Everything external (GitHub REST,
# Telegram, Foundry, Storage) is mocked in the tests, so this job needs no
# secrets and never touches personal data.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: harness unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Flex Consumption runtime the harness deploys to.
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r harness/requirements.txt -r harness/requirements-dev.txt

      - name: Run tests
        run: python -m pytest
