name: "Tests"

# Unit tests for the Function App harness. Everything external (GitHub REST,
# Telegram, Foundry, Storage) is mocked in the tests, so this job needs no
# secrets and never touches personal data.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: harness unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Flex Consumption runtime the harness deploys to.
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r harness/requirements.txt -r harness/requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  ui:
    name: browser UI tests
    # The 134 Playwright tests skip in the job above, which installs no browser. Here they must
    # run: a skipped test fails the job. Pinned to 24.04 so the browser's system packages do
    # not change underneath the ubuntu-latest image migration.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r harness/requirements.txt -r harness/requirements-dev.txt -r harness/requirements-ui.txt
          python -m playwright install --with-deps chromium

      - name: Run tests with the browser
        run: python -m pytest -rs --junitxml=ui-results.xml

      - name: Require every test to run
        shell: python
        run: |
          import xml.etree.ElementTree as ET

          skipped = [
              f'{case.get("classname")}::{case.get("name")}'
              for case in ET.parse("ui-results.xml").iter("testcase")
              if case.find("skipped") is not None
          ]
          if skipped:
              raise SystemExit(f"{len(skipped)} tests were skipped, for example: {skipped[:5]}")
          print("No test was skipped")
